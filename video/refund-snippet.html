<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refund snippet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Same tokens as the showcase app, so it cuts cleanly against screen recordings of it. */
    :root {
      --bg: #0b1120;
      --text: #f1f5f9;
      --dim: #8191ab;
      --kw: #c4b5fd;     /* keywords */
      --prop: #93c5fd;   /* property access */
      --num: #fcd34d;    /* numbers */
      --yes: #4ade80;    /* autoRefund */
      --no: #f87171;     /* autoDecline */
      --mid: #fbbf24;    /* sendToHuman */
      --size: 2.65vw;    /* 51px on a 1920-wide frame; scales with the screen */
    }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      place-items: center;
      cursor: none; /* no pointer in the recording */
      background:
        radial-gradient(1200px 700px at 88% -10%, rgb(34 197 94 / 0.10), transparent 70%),
        radial-gradient(900px 600px at 0% 110%, rgb(56 189 248 / 0.07), transparent 70%),
        var(--bg);
      color: var(--text);
      font: 500 var(--size) / 1.65 'Fira Code', ui-monospace, Menlo, monospace;
      font-variant-ligatures: none; /* keep >= and <= as two characters */
      -webkit-font-smoothing: antialiased;
    }
    pre { margin: 0; white-space: pre; }
    .line { display: block; }
    .kw { color: var(--kw); }
    .prop { color: var(--prop); }
    .num { color: var(--num); }
    .yes { color: var(--yes); }
    .no { color: var(--no); }
    .mid { color: var(--mid); }
    .p { color: var(--text); font-weight: 600; }

    /* ?step — lines start hidden; click, space, or → reveals the next one */
    body.step .line { opacity: 0; transform: translateY(0.35em); }
    body.step .line.on { opacity: 1; transform: none; transition: opacity 320ms ease-out, transform 320ms cubic-bezier(0.22, 1, 0.36, 1); }
  </style>
</head>
<body>
  <pre><span class="line"><span class="kw">const</span> <span class="p">p</span> = answers.<span class="prop">refund_allowed</span>.<span class="prop">noul</span>;</span><span class="line"><span class="kw">if</span> (p &gt;= <span class="num">0.9</span>) <span class="yes">autoRefund</span>();</span><span class="line"><span class="kw">else if</span> (p &lt;= <span class="num">0.1</span>) <span class="no">autoDecline</span>();</span><span class="line"><span class="kw">else</span> <span class="mid">sendToHuman</span>();</span></pre>
  <script>
    if (new URLSearchParams(location.search).has('step')) {
      document.body.classList.add('step');
      const lines = [...document.querySelectorAll('.line')];
      let shown = 0;
      const next = () => { if (shown < lines.length) lines[shown++].classList.add('on'); };
      const prev = () => { if (shown > 0) lines[--shown].classList.remove('on'); };
      addEventListener('click', next);
      addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); next(); }
        if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); prev(); }
      });
    }
  </script>
</body>
</html>
